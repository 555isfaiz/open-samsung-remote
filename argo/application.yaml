apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: samsung-remote
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/555isfaiz/open-samsung-remote.git
    targetRevision: main
    path: chart
    helm:
      releaseName: samsung-remote
      # Edit these in the Argo CD UI under App > Parameters, or here in git.
      # NOTE: image.tag is intentionally NOT overridden here. CI writes the
      # immutable tag into chart/values.yaml on each build; that git change is
      # what Argo detects and rolls out. A parameter override would shadow it.
      parameters:
        - { name: image.repository, value: "rp.images.local/open-samsung-remote" }
        - { name: image.pullPolicy, value: "Always" }
        - { name: tv.host,          value: "192.168.1.50" }
        - { name: tv.mac,           value: "AA:BB:CC:DD:EE:FF" }
        - { name: tv.name,          value: "WebRemote" }
        - { name: ingress.host,     value: "tv.example.com" }
  destination:
    server: https://kubernetes.default.svc
    namespace: samsung-remote
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
