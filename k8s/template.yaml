---
apiVersion: v1
kind: ConfigMap
metadata:
  name: samsung-remote-config
data:
  config.yaml: |
    tv:
      host: ${TV_HOST}
      port: 8002
      name: ${TV_NAME}
      mac: "${TV_MAC}"
      token_file: /data/token.txt
    apps:
      - { name: Netflix,   id: "3201907018807" }
      - { name: YouTube,   id: "111299001912" }
      - { name: Prime,     id: "3201512006785" }
      - { name: "Disney+", id: "3201901017640" }
    macros:
      movie_night:
        - { wol: true }
        - { delay: 8 }
        - { key: KEY_HDMI2 }
        - { delay: 1 }
        - { app: "3201512006785" }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: samsung-remote-token
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 64Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: samsung-remote
  labels: { app: samsung-remote }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: samsung-remote }
  template:
    metadata:
      labels: { app: samsung-remote }
    spec:
      # hostNetwork REQUIRED: Wake-on-LAN is an L2 broadcast that the pod
      # overlay network NATs/drops. On host network the magic packet goes out
      # the node's real LAN interface, same subnet as the TV.
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
        - name: samsung-remote
          image: ${IMAGE}
          ports:
            - containerPort: 5000
          env:
            - name: CONFIG_PATH
              value: /config/config.yaml
          volumeMounts:
            - { name: config, mountPath: /config }
            - { name: token,  mountPath: /data }
          readinessProbe:
            httpGet: { path: /health, port: 5000 }
            initialDelaySeconds: 5
            periodSeconds: 15
      volumes:
        - name: config
          configMap: { name: samsung-remote-config }
        - name: token
          persistentVolumeClaim: { claimName: samsung-remote-token }
---
apiVersion: v1
kind: Service
metadata:
  name: samsung-remote
spec:
  type: ClusterIP
  selector:
    app: samsung-remote
  ports:
    - name: http
      port: 80
      targetPort: 5000
      protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: samsung-remote-ingress
spec:
  ingressClassName: nginx
  rules:
    - host: ${INGRESS_HOST}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: samsung-remote
                port:
                  number: 80
