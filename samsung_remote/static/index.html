<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#111" />
  <title>TV Remote</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <div id="toast" class="toast"></div>

  <main class="remote">
    <div class="row top">
      <button class="btn power" data-key="KEY_POWER">⏻</button>
      <button class="btn" data-wol="1">Wake</button>
      <button class="btn" data-key="KEY_SOURCE">Source</button>
    </div>

    <div class="row">
      <button class="btn" data-key="KEY_VOLUP">Vol +</button>
      <button class="btn" data-key="KEY_HOME">Home</button>
      <button class="btn" data-key="KEY_CHUP">Ch +</button>
    </div>
    <div class="row">
      <button class="btn" data-key="KEY_MUTE">Mute</button>
      <button class="btn" data-key="KEY_MENU">Menu</button>
      <button class="btn" data-key="KEY_CHDOWN">Ch -</button>
    </div>
    <div class="row">
      <button class="btn" data-key="KEY_VOLDOWN">Vol -</button>
      <button class="btn" data-key="KEY_RETURN">Back</button>
      <button class="btn" data-key="KEY_EXIT">Exit</button>
    </div>

    <!-- D-pad: press = one key, hold an arrow = auto-repeat -->
    <div class="dpad">
      <button class="btn up" data-dpad="KEY_UP">▲</button>
      <button class="btn left" data-dpad="KEY_LEFT">◀</button>
      <button class="btn ok" data-dpad="KEY_ENTER">OK</button>
      <button class="btn right" data-dpad="KEY_RIGHT">▶</button>
      <button class="btn down" data-dpad="KEY_DOWN">▼</button>
    </div>

    <div class="row">
      <button class="btn" data-key="KEY_REWIND">⏪</button>
      <button class="btn" data-key="KEY_PLAY">⏯</button>
      <button class="btn" data-key="KEY_FF">⏩</button>
    </div>

    <!-- Shown only when a kodi: block is configured -->
    <section id="kodi" hidden>
      <h2>Kodi</h2>
      <div class="row">
        <button class="btn" data-kodi="home">Home</button>
        <button class="btn" data-kodi="osd">OSD</button>
        <button class="btn" data-kodi="video_addons">Add-ons</button>
      </div>
      <div class="row">
        <button class="btn" data-kodi="back_to_player">Back to player</button>
        <button class="btn" data-kodi="stop_playing" aria-label="Stop"><span aria-hidden="true">■</span> Stop</button>
        <button class="btn" data-kodi="playlist">Playlist</button>
      </div>
      <form id="kodi-text" class="textrow">
        <input type="text" placeholder="Text for Kodi keyboard" autocomplete="off" enterkeyhint="send" />
        <button type="button" class="btn" data-kodi="backspace">⌫</button>
        <button type="submit" class="btn">Send</button>
      </form>
    </section>

    <section>
      <h2>Apps</h2>
      <div id="apps" class="grid"></div>
    </section>

    <section>
      <h2>Macros</h2>
      <div id="macros" class="grid"></div>
    </section>
  </main>

  <script src="/static/remote.js"></script>
</body>
</html>
