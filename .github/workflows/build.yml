name: build-and-push

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute image tag
        id: vars
        run: echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build image
        run: |
          docker build \
            -t rp.images.local/samsung-remote:${{ steps.vars.outputs.sha }} \
            -t rp.images.local/samsung-remote:latest \
            .

      - name: Push image
        run: |
          docker push rp.images.local/samsung-remote:${{ steps.vars.outputs.sha }}
          docker push rp.images.local/samsung-remote:latest
