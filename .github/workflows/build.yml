name: build-and-push

on:
  push:
    branches: [main]
    paths:
      - 'chart/**'
      - 'samsung_remote/**'
      - 'Dockerfile'
      - 'requirements.txt'
      - 'wsgi.py'
  workflow_dispatch:

permissions:
  contents: write   # needed to commit the image-tag bump back to git

jobs:
  build:
    runs-on: arc-runner-set-open-samsung-remote
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Compute image tag
        id: vars
        run: echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build image
        run: |
          buildah bud \
            --tls-verify=false \
            -t rp.images.local/open-samsung-remote:${{ steps.vars.outputs.sha }} \
            .

      - name: Push image
        run: |
          buildah push --tls-verify=false rp.images.local/open-samsung-remote:${{ steps.vars.outputs.sha }}

      - name: Bump chart image tag and commit
        run: |
          sed -i "s|^\(  tag:\).*|\1 ${{ steps.vars.outputs.sha }}|" chart/values.yaml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add chart/values.yaml
          git commit -m "ci: deploy image ${{ steps.vars.outputs.sha }} [skip ci]"
          git push origin HEAD:main
