name: build-and-push

on:
  push:
    branches: [main]
    paths:
      - 'k8s/**'
      - 'chart/**'
      - 'samsung_remote/**'
      - 'Dockerfile'
      - 'requirements.txt'
      - 'wsgi.py'
  workflow_dispatch:

jobs:
  build:
    runs-on: arc-runner-set-open-samsung-remote
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute image tag
        id: vars
        run: echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build image
        run: |
          docker build \
            -t rp.images.local/open-samsung-remote:${{ steps.vars.outputs.sha }} \
            -t rp.images.local/open-samsung-remote:latest \
            .

      - name: Push image
        run: |
          docker push rp.images.local/open-samsung-remote:${{ steps.vars.outputs.sha }}
          docker push rp.images.local/open-samsung-remote:latest
